# This file enables main EWH services.
external_components:
  - source: github://Druidblack/esphome-ewh@$project_branch

logger:
  baud_rate: 0
uart:
  tx_pin: TX
  rx_pin: RX
  baud_rate: 9600

vport:
  - platform: ewh
    command_interval: 50ms
    command_queue_size: 32

ewh:

climate:
  - platform: ewh
    id: whc
    name: None # use friendly_name
    bst:
      name: "BST"
    communication:
      name: "Communication"
      disabled_by_default: true
    communication_age:
      name: "Communication age"
      disabled_by_default: true
    rx_frames:
      name: "UART RX Frames"
      disabled_by_default: true
    tx_frames:
      name: "UART TX Frames"
      disabled_by_default: true
    crc_errors:
      name: "UART CRC Errors"
      disabled_by_default: true
    frame_timeouts:
      name: "UART Frame Timeouts"
      disabled_by_default: true
    invalid_frames:
      name: "UART Invalid Frames"
      disabled_by_default: true
    command_retries:
      name: "Command Retries"
      disabled_by_default: true
    command_failures:
      name: "Command Failures"
      disabled_by_default: true
    queue_overflows:
      name: "Command Queue Overflows"
      disabled_by_default: true
