substitutions:
  # ESPHome 2026.6+ recommends selecting the MCU with `variant` instead of
  # forcing a PlatformIO board. Override this from the device YAML when using
  # another ESP32 family member, for example: esp32c3 or esp32s3.
  variant: esp32
  framework_type: esp-idf
  # Kept only for project metadata/backward-compatible substitutions.
  # It is intentionally NOT passed to the `esp32:` component.
  board: esp32dev

esphome:
  # ESPHome 2026.6+ uses native build flags for both PlatformIO and the
  # native ESP-IDF toolchain. Keep this outside platformio_options to avoid
  # deprecation/ignored-option warnings with ESP-IDF.
  build_flags:
    - -std=gnu++17

esp32:
  variant: $variant
  framework:
    type: $framework_type
